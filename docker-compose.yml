services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-instagram-anna
    restart: unless-stopped
    ports:
      # Só acessível a partir deste computador (mais seguro). Em servidor, veja o guia.
      - "127.0.0.1:5678:5678"
    # Todas as variáveis do arquivo config.env entram no n8n (inclusive a chave de criptografia)
    env_file:
      - config.env
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Necessário para os workflows lerem as chaves via $env.*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
